name: mangalasutram
description: "Sacred Matrimony - Traditional Brahmin Matrimony App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.3
  intl: ^0.19.0
  provider: ^6.1.5
  google_sign_in: 6.2.1
  get_it: ^8.0.3
  flutter_dotenv: ^5.2.1
  http: ^1.2.0
  google_fonts: ^8.2.1
  cryptography: ^2.7.0
  file_picker: ^8.1.2
  connectivity_plus: ^6.1.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env